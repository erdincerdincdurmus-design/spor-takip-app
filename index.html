<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gelişmiş Spor ve Antrenman Takip Uygulaması</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=Orbitron:wght@500;700;900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    .digital-font { font-family: 'Orbitron', monospace; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Üst Başlık & Kontroller -->
    <div class="flex flex-col md:flex-row justify-between items-center gap-4 bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl backdrop-blur-md">
      <div>
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500">
          <i class="fa-solid me-2 fa-dumbbell text-cyan-400"></i>Spor Takip & ZAMANLAYICI
        </h1>
        <p class="text-slate-400 text-sm mt-1">Süre, Adet, Sıralama, PR ve Performans Gelişim Takibi</p>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <button onclick="resetAllCheckboxes()" class="px-4 py-2 bg-rose-600/80 hover:bg-rose-500 text-white rounded-xl text-sm font-semibold transition flex items-center gap-2 shadow-lg hover:shadow-rose-500/20">
          <i class="fa-solid fa-rotate-left"></i> Tüm Tikleri Sıfırla
        </button>
      </div>
    </div>

    <!-- DİJİTAL EKRAN & KRONOMETRE / SAYAÇ PANELİ -->
    <div id="timer-display-card" class="bg-slate-900/90 border-2 border-cyan-500/30 rounded-3xl p-6 shadow-2xl relative overflow-hidden transition-all duration-300">
      <div class="absolute top-0 right-0 w-32 h-32 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>

      <!-- Mod Seçimi & Ses/Alkış Barı -->
      <div class="flex flex-wrap justify-between items-center gap-4 mb-4 border-b border-slate-800 pb-4">
        <div class="flex bg-slate-800 rounded-xl p-1 border border-slate-700">
          <button id="mode-timer-btn" onclick="switchMode('timer')" class="px-4 py-1.5 rounded-lg text-sm font-bold transition bg-cyan-500 text-slate-950">
            <i class="fa-solid fa-hourglass-half me-1"></i> Geri Sayım Sayacı
          </button>
          <button id="mode-stopwatch-btn" onclick="switchMode('stopwatch')" class="px-4 py-1.5 rounded-lg text-sm font-bold transition text-slate-400 hover:text-white">
            <i class="fa-solid fa-stopwatch me-1"></i> Kronometre (PR)
          </button>
        </div>

        <!-- Mikrofon & Ses/Alkış Tetikleyici -->
        <div class="flex items-center gap-3 bg-slate-800/80 px-3 py-1.5 rounded-xl border border-slate-700">
          <button id="mic-toggle-btn" onclick="toggleAudioControl()" class="text-xs px-2.5 py-1 rounded-lg bg-slate-700 text-slate-300 font-semibold hover:bg-slate-600 transition flex items-center gap-1.5">
            <i id="mic-icon" class="fa-solid fa-microphone-slash text-rose-400"></i> Ses/Alkış Kontrol
          </button>
          <div id="audio-level-container" class="hidden flex items-center gap-2">
            <div class="w-16 h-2 bg-slate-700 rounded-full overflow-hidden">
              <div id="audio-level-bar" class="h-full bg-cyan-400 w-0 transition-all duration-75"></div>
            </div>
            <span id="audio-status-badge" class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-slate-700 text-slate-400">Dinliyor...</span>
          </div>
        </div>
      </div>

      <!-- DEV EKRAN -->
      <div class="text-center py-4">
        <div id="selected-exercise-title" class="text-cyan-400 font-semibold text-base mb-1 tracking-wide">
          Egzersiz Seçilmedi (Serbest Mod)
        </div>
        <div id="main-display" class="digital-font text-6xl md:text-8xl font-black text-white tracking-widest my-2 drop-shadow-[0_0_20px_rgba(6,182,212,0.4)]">
          00:00.0
        </div>
      </div>

      <!-- Kontrol Butonları -->
      <div class="flex justify-center items-center gap-4 mt-2">
        <button id="start-stop-btn" onclick="toggleTimer()" class="w-16 h-16 rounded-2xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-extrabold text-2xl flex items-center justify-center transition shadow-lg shadow-cyan-500/30 hover:scale-105 active:scale-95">
          <i id="play-icon" class="fa-solid fa-play ms-1"></i>
        </button>
        <button onclick="resetTimer()" class="w-12 h-12 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-lg flex items-center justify-center transition border border-slate-700">
          <i class="fa-solid fa-rotate-right"></i>
        </button>
        
        <!-- PR Olarak Kaydet Butonu -->
        <button id="save-pr-btn" onclick="saveCurrentTimeAsPR()" class="hidden px-4 py-3 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl font-bold text-sm transition flex items-center gap-2 shadow-lg shadow-amber-500/20">
          <i class="fa-solid fa-trophy"></i> Rekor (PR) Kaydet
        </button>
      </div>

      <!-- Hızlı Geri Sayım Süre Seçimi -->
      <div id="quick-preset-container" class="flex justify-center gap-2 mt-6 border-t border-slate-800/80 pt-4">
        <button onclick="setPresetTime(30)" class="px-3 py-1 rounded-lg bg-slate-800 text-xs text-slate-300 font-medium hover:bg-slate-700 border border-slate-700/50">30s</button>
        <button onclick="setPresetTime(45)" class="px-3 py-1 rounded-lg bg-slate-800 text-xs text-slate-300 font-medium hover:bg-slate-700 border border-slate-700/50">45s</button>
        <button onclick="setPresetTime(60)" class="px-3 py-1 rounded-lg bg-slate-800 text-xs text-slate-300 font-medium hover:bg-slate-700 border border-slate-700/50">60s</button>
        <button onclick="setPresetTime(90)" class="px-3 py-1 rounded-lg bg-slate-800 text-xs text-slate-300 font-medium hover:bg-slate-700 border border-slate-700/50">90s</button>
      </div>
    </div>

    <!-- HAREKET LİSTESİ PANELİ -->
    <div class="bg-slate-800/50 border border-slate-700/70 rounded-2xl p-6 backdrop-blur-md">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-list-check text-cyan-400"></i> Egzersiz Listesi
        </h2>
        <button onclick="openAddExerciseModal()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-sm rounded-xl transition flex items-center gap-2 shadow-lg shadow-emerald-600/20">
          <i class="fa-solid fa-plus"></i> Yeni Hareket Ekle
        </button>
      </div>

      <!-- Dinamik Liste Container -->
      <div id="exercise-list" class="space-y-3">
        <!-- JS Tarafından Doldurulacak -->
      </div>
    </div>

  </div>

  <!-- YENİ HAREKET EKLEME MODALI -->
  <div id="add-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
      <h3 class="text-lg font-bold text-white flex items-center gap-2">
        <i class="fa-solid fa-plus-circle text-emerald-400"></i> Yeni Egzersiz Ekle
      </h3>
      
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Egzersiz Adı</label>
        <input type="text" id="new-name" placeholder="Örn: Jumping Jack" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-500 text-sm">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">Egzersiz Tipi</label>
        <select id="new-type" onchange="toggleModalTypeInput()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-500 text-sm">
          <option value="time">Süre Bazlı (Saniye)</option>
          <option value="reps">Tekrar Bazlı (Adet)</option>
        </select>
      </div>

      <div id="modal-val-container">
        <label id="modal-val-label" class="block text-xs font-semibold text-slate-400 mb-1">Varsayılan Süre (sn)</label>
        <input type="number" id="new-value" value="30" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-500 text-sm">
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeAddExerciseModal()" class="px-4 py-2 bg-slate-700 text-slate-300 font-semibold text-xs rounded-xl hover:bg-slate-600">İptal</button>
        <button onclick="addNewExercise()" class="px-4 py-2 bg-emerald-600 text-white font-semibold text-xs rounded-xl hover:bg-emerald-500">Kaydet</button>
      </div>
    </div>
  </div>

  <script>
    const defaultExercises = [
      { id: '1', name: 'Şınav (Push-up)', type: 'reps', value: 15, checked: false, pr: 0, history: [] },
      { id: '2', name: 'Mekik (Sit-up)', type: 'reps', value: 20, checked: false, pr: 0, history: [] },
      { id: '3', name: 'Plank', type: 'time', value: 45, checked: false, pr: 45, history: [] },
      { id: '4', name: 'Squat (Çökme)', type: 'reps', value: 20, checked: false, pr: 0, history: [] },
      { id: '5', name: 'Lunge (Adımlama)', type: 'reps', value: 12, checked: false, pr: 0, history: [] },
      { id: '6', name: 'Burpee', type: 'reps', value: 10, checked: false, pr: 0, history: [] },
      { id: '7', name: 'Mountain Climber', type: 'time', value: 30, checked: false, pr: 0, history: [] },
      { id: '8', name: 'Jumping Jack', type: 'time', value: 45, checked: false, pr: 0, history: [] },
      { id: '9', name: 'Ters Mekik (Superman)', type: 'reps', value: 15, checked: false, pr: 0, history: [] },
      { id: '10', name: 'Dips (Sandalye)', type: 'reps', value: 12, checked: false, pr: 0, history: [] },
      { id: '11', name: 'Biceps Curls (Dumbbell)', type: 'reps', value: 12, checked: false, pr: 0, history: [] },
      { id: '12', name: 'Leg Raise (Bacak Kaldırma)', type: 'reps', value: 15, checked: false, pr: 0, history: [] },
      { id: '13', name: 'Wall Sit (Duvar Oturuşu)', type: 'time', value: 60, checked: false, pr: 60, history: [] },
      { id: '14', name: 'High Knees (Yüksek Diz)', type: 'time', value: 30, checked: false, pr: 0, history: [] },
      { id: '15', name: 'Glute Bridge (Kalça Kaldırma)', type: 'reps', value: 15, checked: false, pr: 0, history: [] }
    ];

    let exercises = [];
    let currentMode = 'timer'; 
    let timerInterval = null;
    let timeRemaining = 30; 
    let stopwatchTime = 0; 
    let isRunning = false;
    let activeExerciseId = null;

    let audioContext = null;
    let analyser = null;
    let microphone = null;
    let isAudioActive = false;
    let lastClapTime = 0;

    window.onload = () => {
      loadAndMigrateExercises();
      renderExercises();
      updateDisplay();
    };

    function loadAndMigrateExercises() {
      const storedV3 = localStorage.getItem('workout_exercises_v3');
      const storedV2 = localStorage.getItem('workout_exercises_v2');

      if (storedV3) {
        exercises = JSON.parse(storedV3);
      } else if (storedV2) {
        try {
          const oldList = JSON.parse(storedV2);
          exercises = oldList.map(item => {
            const isTime = item.name.toLowerCase().includes('plank') || 
                           item.name.toLowerCase().includes('sit') || 
                           item.name.toLowerCase().includes('climber') || 
                           item.name.toLowerCase().includes('jack') || 
                           item.name.toLowerCase().includes('knees') || 
                           (item.duration && item.duration > 0 && item.reps === 1);

            const itemType = isTime ? 'time' : 'reps';
            const itemVal = isTime ? (item.duration || 30) : (item.reps || 10);

            const migratedHistory = (item.history || []).map(h => ({
              timestamp: h.timestamp,
              dateStr: h.dateStr,
              valStr: `${itemVal}${isTime ? 's' : ' Adet'}`
            }));

            return {
              id: item.id || Date.now().toString(),
              name: item.name,
              type: itemType,
              value: itemVal,
              checked: item.checked || false,
              pr: item.pr || 0,
              history: migratedHistory
            };
          });

          saveExercises();
        } catch (e) {
          exercises = defaultExercises;
          saveExercises();
        }
      } else {
        exercises = defaultExercises;
        saveExercises();
      }
    }

    function saveExercises() {
      localStorage.setItem('workout_exercises_v3', JSON.stringify(exercises));
    }

    function renderExercises() {
      const container = document.getElementById('exercise-list');
      container.innerHTML = '';

      exercises.forEach((item, index) => {
        let historyHTML = '';
        if (item.history && item.history.length > 0) {
          const recentLogs = item.history.slice(0, 5);

          const badgesHTML = recentLogs.map((log, idx) => `
            <span class="${idx === 0 ? 'bg-cyan-950/80 text-cyan-300 border-cyan-800/60 font-semibold' : 'bg-slate-900 text-slate-400 border-slate-700/50'} px-2 py-0.5 rounded border text-[10px] flex items-center gap-1">
              <span>${log.dateStr}</span>
              <span class="text-amber-400 font-bold ms-1">➔ ${log.valStr}</span>
            </span>
          `).join('');

          historyHTML = `
            <div class="mt-2 text-[11px] text-slate-400 flex flex-wrap items-center gap-1.5 pt-2 border-t border-slate-700/40">
              <span class="text-slate-500 text-[10px] me-1 font-bold">Son Performanslar:</span>
              ${badgesHTML}
            </div>
          `;
        }

        const isTimeType = item.type === 'time';
        const isSelectedAndRunning = activeExerciseId === item.id && currentMode === 'stopwatch' && isRunning;

        const div = document.createElement('div');
        div.className = `p-3.5 rounded-xl border transition-all ${
          activeExerciseId === item.id
            ? 'bg-cyan-950/30 border-cyan-500/80 shadow-lg shadow-cyan-500/10'
            : item.checked 
              ? 'bg-emerald-950/20 border-emerald-500/30 text-slate-300' 
              : 'bg-slate-900/80 border-slate-700/60 hover:border-slate-600'
        }`;

        div.innerHTML = `
          <div class="flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
            
            <div class="flex items-center gap-2.5 flex-1 w-full md:w-auto">
              <div class="flex flex-col text-slate-500 gap-0.5 me-1">
                <button onclick="moveExercise(${index}, -1)" class="hover:text-cyan-400 transition text-[11px] px-1" title="Yukarı Taşı">
                  <i class="fa-solid fa-chevron-up"></i>
                </button>
                <button onclick="moveExercise(${index}, 1)" class="hover:text-cyan-400 transition text-[11px] px-1" title="Aşağı Taşı">
                  <i class="fa-solid fa-chevron-down"></i>
                </button>
              </div>

              <input type="checkbox" ${item.checked ? 'checked' : ''} onchange="toggleCheck('${item.id}')" 
                class="w-5 h-5 rounded text-cyan-500 bg-slate-950 border-slate-700 focus:ring-cyan-500 cursor-pointer">
              
              <div class="flex-1">
                <div class="font-bold text-slate-100 flex items-center gap-2">
                  <span class="${item.checked ? 'line-through text-slate-400' : ''}">${item.name}</span>
                  ${item.pr > 0 ? `
                    <span class="bg-amber-500/10 text-amber-400 border border-amber-500/30 text-[10px] font-bold px-2 py-0.5 rounded-full flex items-center gap-1">
                      <i class="fa-solid fa-trophy text-[9px]"></i> PR: ${item.pr}s
                    </span>
                  ` : ''}
                </div>
              </div>
            </div>

            <div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-end">
              
              <button onclick="toggleExerciseType('${item.id}')" class="text-[10px] font-bold px-2 py-1 rounded-lg border transition ${
                isTimeType 
                  ? 'bg-cyan-950/70 text-cyan-300 border-cyan-700/60' 
                  : 'bg-emerald-950/70 text-emerald-300 border-emerald-700/60'
              }" title="Tipi Değiştir (Süre / Adet)">
                <i class="fa-solid ${isTimeType ? 'fa-clock' : 'fa-list-ol'} me-1"></i>${isTimeType ? 'Süre' : 'Adet'}
              </button>

              <div class="flex items-center bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-700/80">
                <span class="text-[10px] text-slate-400 me-1 font-semibold">${isTimeType ? 'Süre:' : 'Adet:'}</span>
                <input type="number" value="${item.value}" onchange="updateExerciseValue('${item.id}', this.value)" 
                  class="w-12 bg-transparent text-center font-bold text-xs ${isTimeType ? 'text-cyan-400' : 'text-emerald-400'} focus:outline-none">
                <span class="text-[10px] text-slate-500">${isTimeType ? 'sn' : 'ad'}</span>
              </div>

              ${isTimeType ? `
                <button onclick="handleExerciseSelect('${item.id}')" class="p-1.5 px-3 rounded-lg transition text-xs font-bold flex items-center gap-1.5 ${
                  isSelectedAndRunning 
                    ? 'bg-rose-500 text-white shadow-lg shadow-rose-500/30 animate-pulse' 
                    : 'bg-cyan-600/20 text-cyan-400 hover:bg-cyan-500 hover:text-slate-950'
                }">
                  <i class="fa-solid ${isSelectedAndRunning ? 'fa-square' : 'fa-stopwatch'}"></i>
                  ${isSelectedAndRunning ? 'Durdur' : 'Seç & Başlat'}
                </button>
              ` : ''}

              <button onclick="deleteExercise('${item.id}')" class="p-1.5 text-slate-500 hover:text-rose-400 transition text-xs">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>

          </div>

          ${historyHTML}
        `;

        container.appendChild(div);
      });
    }

    // SEÇ BUTONUNA BASILDIĞINDA KRONOMETRE MODUNU VE BÜYÜK SAYAÇ EKRANINI AKTİF ETME
    function handleExerciseSelect(id) {
      const ex = exercises.find(e => e.id === id);
      if (!ex) return;

      // Eğer aynı hareket seçilmişse ve kronometre çalışıyorsa durdur
      if (activeExerciseId === id && currentMode === 'stopwatch' && isRunning) {
        toggleTimer(); // Durdur
        return;
      }

      activeExerciseId = id;

      // Kronometre moduna geç
      if (currentMode !== 'stopwatch') {
        switchMode('stopwatch');
      } else {
        resetTimer();
      }

      document.getElementById('selected-exercise-title').innerText = `Seçilen Egzersiz: ${ex.name}`;

      // Ekranı yumuşak bir şekilde sayaca kaydır
      document.getElementById('timer-display-card').scrollIntoView({ behavior: 'smooth', block: 'center' });

      renderExercises();
    }

    function moveExercise(index, direction) {
      const targetIndex = index + direction;
      if (targetIndex >= 0 && targetIndex < exercises.length) {
        const temp = exercises[index];
        exercises[index] = exercises[targetIndex];
        exercises[targetIndex] = temp;
        saveExercises();
        renderExercises();
      }
    }

    function toggleExerciseType(id) {
      const index = exercises.findIndex(e => e.id === id);
      if (index !== -1) {
        exercises[index].type = exercises[index].type === 'time' ? 'reps' : 'time';
        saveExercises();
        renderExercises();
      }
    }

    function updateExerciseValue(id, val) {
      const index = exercises.findIndex(e => e.id === id);
      if (index !== -1) {
        exercises[index].value = parseInt(val) || 0;
        saveExercises();
      }
    }

    function toggleCheck(id) {
      const index = exercises.findIndex(e => e.id === id);
      if (index !== -1) {
        exercises[index].checked = !exercises[index].checked;

        if (exercises[index].checked) {
          const now = new Date();
          const options = { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' };
          const dateStr = now.toLocaleDateString('tr-TR', options);
          const valStr = `${exercises[index].value}${exercises[index].type === 'time' ? 's' : ' Adet'}`;

          if (!exercises[index].history) exercises[index].history = [];
          
          exercises[index].history.unshift({
            timestamp: now.getTime(),
            dateStr: dateStr,
            valStr: valStr
          });

          if (exercises[index].history.length > 10) {
            exercises[index].history.pop();
          }
        }

        saveExercises();
        renderExercises();
      }
    }

    function deleteExercise(id) {
      if (confirm('Bu egzersizi silmek istediğinize emin misiniz?')) {
        exercises = exercises.filter(e => e.id !== id);
        saveExercises();
        renderExercises();
      }
    }

    function resetAllCheckboxes() {
      exercises.forEach(e => e.checked = false);
      saveExercises();
      renderExercises();
    }

    function updateDisplay() {
      const display = document.getElementById('main-display');
      if (currentMode === 'timer') {
        const mins = Math.floor(timeRemaining / 60);
        const secs = timeRemaining % 60;
        display.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.0`;
      } else {
        const mins = Math.floor(stopwatchTime / 60000);
        const secs = Math.floor((stopwatchTime % 60000) / 1000);
        const ms = Math.floor((stopwatchTime % 1000) / 100);
        display.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}.${ms}`;
      }
    }

    function switchMode(mode) {
      if (isRunning) toggleTimer();
      currentMode = mode;

      const timerBtn = document.getElementById('mode-timer-btn');
      const stopwatchBtn = document.getElementById('mode-stopwatch-btn');
      const presetContainer = document.getElementById('quick-preset-container');
      const savePrBtn = document.getElementById('save-pr-btn');

      if (mode === 'timer') {
        timerBtn.className = 'px-4 py-1.5 rounded-lg text-sm font-bold transition bg-cyan-500 text-slate-950';
        stopwatchBtn.className = 'px-4 py-1.5 rounded-lg text-sm font-bold transition text-slate-400 hover:text-white';
        presetContainer.classList.remove('hidden');
        savePrBtn.classList.add('hidden');
      } else {
        stopwatchBtn.className = 'px-4 py-1.5 rounded-lg text-sm font-bold transition bg-amber-500 text-slate-950';
        timerBtn.className = 'px-4 py-1.5 rounded-lg text-sm font-bold transition text-slate-400 hover:text-white';
        presetContainer.classList.add('hidden');
        savePrBtn.classList.remove('hidden');
      }
      resetTimer();
    }

    function toggleTimer() {
      const playIcon = document.getElementById('play-icon');
      if (isRunning) {
        clearInterval(timerInterval);
        isRunning = false;
        playIcon.className = 'fa-solid fa-play ms-1';
      } else {
        isRunning = true;
        playIcon.className = 'fa-solid fa-pause';

        if (currentMode === 'timer') {
          timerInterval = setInterval(() => {
            if (timeRemaining > 0) {
              timeRemaining--;
              updateDisplay();
            } else {
              clearInterval(timerInterval);
              isRunning = false;
              playIcon.className = 'fa-solid fa-play ms-1';
              alert('Süre Bitti!');
            }
          }, 1000);
        } else {
          const startTime = Date.now() - stopwatchTime;
          timerInterval = setInterval(() => {
            stopwatchTime = Date.now() - startTime;
            updateDisplay();
          }, 100);
        }
      }
      renderExercises();
    }

    function resetTimer() {
      if (isRunning) toggleTimer();
      timeRemaining = 30;
      stopwatchTime = 0;
      updateDisplay();
    }

    function setPresetTime(secs) {
      if (currentMode !== 'timer') switchMode('timer');
      timeRemaining = secs;
      updateDisplay();
    }

    function saveCurrentTimeAsPR() {
      if (!activeExerciseId) {
        alert('Lütfen önce egzersizin yanındaki "Seç & Başlat" butonuna basın.');
        return;
      }
      const secs = Math.floor(stopwatchTime / 1000);
      const exIndex = exercises.findIndex(e => e.id === activeExerciseId);
      if (exIndex !== -1) {
        if (secs > exercises[exIndex].pr) {
          exercises[exIndex].pr = secs;
          saveExercises();
          renderExercises();
          alert(`Tebrikler! ${exercises[exIndex].name} için yeni rekor: ${secs}s!`);
        } else {
          alert(`Mevcut rekorunuz (${exercises[exIndex].pr}s) daha yüksek.`);
        }
      }
    }

    async function toggleAudioControl() {
      const container = document.getElementById('audio-level-container');
      if (isAudioActive) {
        isAudioActive = false;
        container.classList.add('hidden');
        document.getElementById('mic-icon').className = 'fa-solid fa-microphone-slash text-rose-400';
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);
        microphone.connect(analyser);

        analyser.fftSize = 256;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        isAudioActive = true;
        container.classList.remove('hidden');
        document.getElementById('mic-icon').className = 'fa-solid fa-microphone text-emerald-400 animate-pulse';

        function checkAudioLevel() {
          if (!isAudioActive) return;
          analyser.getByteFrequencyData(dataArray);

          let sum = 0;
          for (let i = 0; i < bufferLength; i++) {
            sum += dataArray[i];
          }
          let average = sum / bufferLength;

          document.getElementById('audio-level-bar').style.width = `${Math.min(100, average * 2)}%`;

          if (average > 65) {
            const now = Date.now();
            if (now - lastClapTime > 1200) {
              lastClapTime = now;
              toggleTimer();
            }
          }

          requestAnimationFrame(checkAudioLevel);
        }

        checkAudioLevel();

      } catch (err) {
        alert('Mikrofon erişimi sağlanamadı.');
      }
    }

    function openAddExerciseModal() {
      document.getElementById('add-modal').classList.remove('hidden');
    }

    function closeAddExerciseModal() {
      document.getElementById('add-modal').classList.add('hidden');
    }

    function toggleModalTypeInput() {
      const type = document.getElementById('new-type').value;
      const label = document.getElementById('modal-val-label');
      label.innerText = type === 'time' ? 'Varsayılan Süre (sn)' : 'Varsayılan Tekrar (Adet)';
    }

    function addNewExercise() {
      const name = document.getElementById('new-name').value.trim();
      const type = document.getElementById('new-type').value;
      const val = parseInt(document.getElementById('new-value').value) || 10;

      if (!name) {
        alert('Lütfen egzersiz adını girin.');
        return;
      }

      const newEx = {
        id: Date.now().toString(),
        name: name,
        type: type,
        value: val,
        checked: false,
        pr: 0,
        history: []
      };

      exercises.push(newEx);
      saveExercises();
      renderExercises();
      closeAddExerciseModal();

      document.getElementById('new-name').value = '';
    }
  </script>
</body>
</html>
